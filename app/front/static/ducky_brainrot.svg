<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Canard TN-GPT en mode brainrot, le crâne ouvert sur son cerveau">
  <defs>
    <linearGradient id="br-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2fbf"/>
      <stop offset="0.5" stop-color="#8b2fff"/>
      <stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" fill="url(#br-bg)"/>

  <!-- Rayons façon « deep fried », derrière le canard -->
  <g fill="#ffffff" opacity="0.2">
    <path d="M48 48 L96 26 L96 42 Z"/>
    <path d="M48 48 L96 64 L96 80 Z"/>
    <path d="M48 48 L0 20 L0 36 Z"/>
    <path d="M48 48 L2 74 L16 90 Z"/>
  </g>

  <!-- La calotte crânienne, envolée -->
  <g fill="#ffd23f" stroke="#12060f" stroke-width="2.5" stroke-linejoin="round" transform="rotate(-9 56 10)">
    <path d="M39 15 Q56 -3 73 12 Q56 5 39 15 Z"/>
  </g>

  <!-- Canard : queue, corps, tête, bec -->
  <g stroke="#12060f" stroke-width="3" stroke-linejoin="round">
    <path d="M30 70 L4 49 L32 57 Z" fill="#ffd23f"/>
    <ellipse cx="44" cy="70" rx="24" ry="15" fill="#ffd23f"/>
    <circle cx="56" cy="40" r="18" fill="#ffd23f"/>
    <path d="M73 37 C83 34 90 38 90 42 C90 47 81 49 73 47 Z" fill="#ff8c1a"/>
  </g>

  <!-- Le cerveau, qui déborde du crâne ouvert -->
  <g stroke="#12060f" stroke-width="2.5" stroke-linejoin="round">
    <circle cx="47" cy="24" r="9" fill="#ff8fc8"/>
    <circle cx="65" cy="24" r="9" fill="#ff8fc8"/>
    <circle cx="56" cy="20" r="9" fill="#ff8fc8"/>
  </g>
  <g fill="none" stroke="#c2185b" stroke-width="2" stroke-linecap="round">
    <path d="M44 25 Q48 21 52 25"/>
    <path d="M60 25 Q64 21 68 25"/>
    <path d="M52 17 Q56 21 60 17"/>
  </g>

  <!-- Lunettes noires : le canard a vu trop de reels -->
  <g fill="#12060f">
    <rect x="38" y="37" width="34" height="4" rx="2"/>
    <rect x="41" y="37" width="14" height="12" rx="4"/>
    <rect x="57" y="37" width="14" height="12" rx="4"/>
  </g>

  <!-- Éclairs -->
  <g fill="#ccff00" stroke="#12060f" stroke-width="2" stroke-linejoin="round">
    <path d="M80 14 L70 28 L77 28 L72 40 L86 24 L78 24 Z"/>
    <path d="M19 74 L13 84 L18 84 L15 94 L25 80 L19 80 Z"/>
  </g>
</svg>
