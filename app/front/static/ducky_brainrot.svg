<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Canard TN-GPT en mode brainrot">
  <defs>
    <linearGradient id="br-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2fbf"/>
      <stop offset="0.5" stop-color="#8b2fff"/>
      <stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" fill="url(#br-bg)"/>

  <!-- Rayons façon « deep fried », derrière le canard -->
  <g fill="#ffffff" opacity="0.2">
    <path d="M48 48 L96 24 L96 40 Z"/>
    <path d="M48 48 L96 62 L96 78 Z"/>
    <path d="M48 48 L0 18 L0 34 Z"/>
    <path d="M48 48 L2 72 L16 88 Z"/>
  </g>

  <!-- Canard : queue, corps, tête, bec -->
  <g stroke="#12060f" stroke-width="3" stroke-linejoin="round">
    <path d="M32 62 L5 41 L33 49 Z" fill="#ffd23f"/>
    <ellipse cx="45" cy="63" rx="25" ry="18" fill="#ffd23f"/>
    <circle cx="58" cy="35" r="17" fill="#ffd23f"/>
    <path d="M72 33 C82 30 89 34 89 38 C89 43 80 45 72 43 Z" fill="#ff8c1a"/>
  </g>

  <!-- Lunettes noires : le canard a vu trop de reels -->
  <g fill="#12060f">
    <rect x="40" y="29" width="34" height="4" rx="2"/>
    <rect x="43" y="29" width="14" height="12" rx="4"/>
    <rect x="59" y="29" width="14" height="12" rx="4"/>
  </g>

  <!-- Éclairs -->
  <g fill="#ccff00" stroke="#12060f" stroke-width="2" stroke-linejoin="round">
    <path d="M78 7 L68 21 L75 21 L70 33 L84 17 L76 17 Z"/>
    <path d="M19 68 L13 78 L18 78 L15 88 L25 74 L19 74 Z"/>
  </g>
</svg>
