<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN-GPT</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='ducky_cassis.png') }}?v=2">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-zone-mini">
                <img src="/static/ducky_cassis.png" class="logo-img-mini" id="sidebar-ducky" alt="NeuraTN">
                <div class="speech-bubble mini" id="sidebar-bubble">{{ quote }}</div>
            </div>
            <div class="brand">Discussions</div>
        </div>

        <a href="/" class="new-btn">+ nouvelle conv.</a>
        
        <div class="conv-section">Récent</div>
        <nav class="conv-list">
            <a href="#" class="conv-item active">Salles libres ce soir</a>
        </nav>

        <div class="sidebar-footer">
            <a href="#" class="user-tab" title="Compte (bientôt disponible)">
                <div class="user-avatar">?</div>
                <span class="user-name">Mon compte</span>
            </a>
        </div>
    </aside>

    <main class="main">
        <div class="messages" id="messages">
            <div class="empty" id="empty-state">
                
                <div class="hero-zone">
                    <h1 class="hero-title">TN-<span>GPT</span></h1>
                    <p class="hero-subtitle">Pose-moi n'importe quelle question et j'y répondrai intelligemment :)</p>
                </div>

                <div class="chips">
                    <button class="chip" data-query="Salles libres maintenant">salles libres</button>
                    <button class="chip" data-query="Infos drive 1A">drive 1A</button>
                    <button class="chip" data-query="Lore de TELECOM Nancy">lore TN</button>
                    <button class="chip" data-query="Menu du self cette semaine">menu du self</button>
                </div>
            </div>
        </div>

        <div class="input-area">
            <form class="input-row" id="chat-form">
                <input type="text" id="inp" placeholder="Donne 5 raisons de se gooner en public (urgent)..." autocomplete="off" required>
                <button type="submit" class="send" id="sbtn">envoyer →</button>
            </form>
            <div class="hint">TN-GPT peut faire des erreurs. Il est aussi fiable que le BDE.</div>
        </div>
    </main>

    <script src="/static/main.js"></script>
</body>
</html>
