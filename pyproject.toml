[project]
name = "tn-gpt"
version = "0.1.0"
description = "L'IA optimisé pour TELECOM Nancy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "google-api-python-client>=2.197.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "groq>=1.4.0",
    "langchain-text-splitters>=1.1.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.5.1",
    "torch==2.12.0; sys_platform == 'darwin'",
    "torch==2.12.0+cpu; sys_platform == 'linux'",
    "pymupdf4llm>=1.27.2.3",
    "gunicorn>=26.0.0",
    "dotenv>=0.9.9",
    "torch>=2.12.0",
    "datetime>=6.0",
    "flask-limiter>=4.1.1",
    "flask-compress>=1.24",
    "flask-login>=0.6.3",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mkdocstrings-python>=2.0.4",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.46",
    "zensical>=0.0.45",
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
]

[tool.uv]
# 🌟 CONFIGURATION BLINDÉE ICI : On sépare strictement les environnements requis
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]


[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL","RUF100"]
ignore = ["T201","S","D100","D104","D401","D203","D213","COM812"]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.bandit]
exclude_dirs = [".venv","tests","models_cache","__pycache__",".ruf_cache",".uv-cache"]
skips = ["B101"]
