[project]
name = "tn-gpt"
version = "0.1.0"
description = "L'IA optimisé pour TELECOM Nancy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "google-api-python-client>=2.197.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "groq>=1.4.0",
    "langchain-text-splitters>=1.1.2",
    "qdrant-client>=1.18.0",
    # Épinglé sous la 1.x : depuis la 1.27, pymupdf4llm tire pymupdf-layout,
    # donc onnxruntime et ~118 Mo de modèles .onnx (layout, tables, décision
    # OCR) qui s'exécutent en local à chaque conversion de PDF. La 0.3.x expose
    # le même `to_markdown()` sans aucune inférence locale.
    "pymupdf4llm>=0.3.4,<1.0",
    "gunicorn>=26.0.0",
    "dotenv>=0.9.9",
    "datetime>=6.0",
    "flask-limiter>=4.1.1",
    "flask-compress>=1.24",
    "flask-login>=0.6.3",
    "flask-wtf>=1.3.0",
    "wtforms>=3.2.2",
    "sqlalchemy>=2.0.51",
    "flask-sqlalchemy>=3.1.1",
    "bcrypt>=5.0.0",
    "psycopg2-binary>=2.9",
    "flask-migrate>=4.1.0",
    "httpx>=0.28.1",
    "rapidfuzz>=3.14.5",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "complexipy>=6.2.0",
    "mkdocstrings-python>=2.0.4",
    "optuna>=4.9.0",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.46",
    "zensical>=0.0.45",
]
[tool.uv]
# 🌟 CONFIGURATION BLINDÉE ICI : On sépare strictement les environnements requis
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
# setuptools est tiré comme dépendance de build ; on force la version corrigée
# (PYSEC-2026-3447) que la résolution normale ne remonte pas.
override-dependencies = ["setuptools>=83.0.0"]


[tool.ruff]
target-version = "py313"
# Migrations Alembic : fichiers auto-générés, non soumis au style du projet.
# Bancs Optuna : exclusion TEMPORAIRE. Ces trois fichiers ne s'importent même
# plus (pandas et sentence-transformers ne sont plus installés) et portaient à
# eux seuls 334 des 335 violations ruff, ce qui rendait le stage lint rouge en
# permanence. À supprimer ou à sortir du package quand on reprendra l'Optuna.
extend-exclude = ["migrations", "app/back/optuna*.py"]

[tool.ruff.lint]
select = ["ALL","RUF100"]
ignore = ["T201","S","D100","D104","D401","D203","D213","COM812","CPY001"]
[tool.ruff.lint.per-file-ignores]
# S101 : `assert` est la façon d'écrire une assertion en pytest.
# SLF001 : les tests éprouvent aussi les helpers privés d'un module, c'est leur
# rôle — l'alternative serait de rendre publiques des fonctions internes.
"tests/**/*.py" = ["S101", "SLF001"]
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ty.src]
# Migrations Alembic : auto-générées, non type-checkées.
# Bancs Optuna : voir la note sous [tool.ruff], même exclusion temporaire.
exclude = ["migrations", "app/back/optuna*.py"]

[tool.ty.rules]
unsupported-base = "ignore"

[tool.bandit]
# Migrations Alembic : leurs 13 B608 sont du SQL littéral écrit à la main dans
# des migrations de données, sans la moindre entrée utilisateur. Déjà hors de
# ruff et de ty pour la même raison.
# Bancs Optuna : voir la note sous [tool.ruff], même exclusion temporaire.
exclude_dirs = [".venv","tests","__pycache__",".ruf_cache",".uv-cache","migrations","app/back/optuna_rag_benchmark.py","app/back/optuna_retrieval_benchmark.py","app/back/optuna3.py"]
skips = ["B101"]

[tool.complexipy]
max-complexity-allowed = 15
failed = true

[tool.pydoclint]
exclude = [
    ".git",
    ".venv",
    ".env",
    "env",
    "venv",
    "build",
    "dist",
    "__pycache__",
]
