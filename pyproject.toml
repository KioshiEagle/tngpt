[project]
name = "tn-gpt"
version = "0.1.0"
description = "L'IA optimisé pour TELECOM Nancy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "google-api-python-client>=2.197.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "groq>=1.4.0",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "pandas>=3.0.3",
    "pypdf>=6.13.1",
    "qdrant-client>=1.18.0",
    "semantic-chunkers>=0.1.1",
    "sentence-transformers>=5.5.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.46",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "C90", "I", "B","N","UP","A","SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

docstring-code-format = true

[tool.bandit]
exclude_dirs = [".venv","tests","models_cache","__pycache__",".ruf_cache"]
skips = ["B101"]
