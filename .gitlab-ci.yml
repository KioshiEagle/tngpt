image: ghcr.io/astral-sh/uv:0.11.21-python3.13-trixie

stages:
  - check_code_quality
  - test
  - build
  - deploy

lint:
  stage : check_code_quality
  script:
    - uv lock --check
    - uvx ruff check . --statistics
    - uvx ruff format . --check
    - uv check
    - uvx ty check
#uv check est encore expérimental donc je laisse uvx ty check pour l'instant
check_security:
  stage: check_code_quality
  script:
    - uvx bandit -c pyproject.toml -r .
    - uv audit --ignore GHSA-rrmf-rvhw-rf47
    - uvx pip-audit
# Ignore GHSA-rrmf-rvhw-rf47 / CVE-2025-3000:
# affects torch.jit.script / TorchScript.
# This project does not use torch.jit.script.

#uv audit est encore expérimental donc je laisse pip-audit pour l'instant
pytest:
  stage: test
  script:
    - uv sync
    - uv run pytest tests/

