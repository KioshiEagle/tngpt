#version pas bien mais fonctionnel...
build_and_push_image:
  stage: build
  # 1. On remplace l'image Docker par l'exécuteur de Google Kaniko
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  
  # 2. PLUS BESOIN de la section "services" (on oublie dind et les problèmes de TLS)
  
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

  before_script:
    # 3. On crée le fichier de configuration d'authentification pour le Registry GitLab
    # C'est l'équivalent strict du "docker login", mais au format JSON pour Kaniko
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

  script:
    # 4. Kaniko lit le Dockerfile, compile en user-space et push l'image finale tout seul
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_TAG}"
      --skip-tls-verify

  # temporairement commenté pour tes tests sur ta branche JC/dev
  #only:
  #  - master

deploy_to_server:
  stage: deploy
  image: alpine:latest
  script:
    # 1. Installation d'un client SSH léger dans le conteneur jetable d'Alpine
    - apk add --no-cache openssh-client
    
    # 2. Démarrage de l'agent SSH et injection de ta clé secrète stockée dans GitLab
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_KEY" | tr -d '\r' | ssh-add -
    
    # 3. Configuration de la sécurité pour éviter que la CI ne bloque sur la validation du serveur
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    
    # 4. Ordres envoyés en SSH à ton Droplet DigitalOcean
    - |
      ssh root@64.226.99.199 "
        # A. Ton Droplet se connecte au Registry GitLab avec les identifiants éphémères du Job
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        
        # B. Il télécharge la toute nouvelle image scellée à l'étape 3
        docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG &&
        
        # C. Il coupe l'ancien conteneur de l'application s'il existe (sans faire planter le script si c'est le premier déploiement)
        docker stop tngpt-app || true &&
        docker rm tngpt-app || true &&
        
        # D. Il lance le nouveau conteneur en liant le port 5000 et en important tes variables d'environnement locales
        docker run -d --name tngpt-app -p 5000:5000 --restart always $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG &&
        
        # E. Nettoyage : Supprime les vieilles images inutilisées pour ne pas surcharger les 50 Go de ton SSD
        docker image prune -f
      "
  environment:
    name: production
    url: 64.226.99.199:5000
  #only:
  #  - master