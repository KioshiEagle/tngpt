# #version pas bien mais fonctionnel...
build_and_push_image:
  stage: build
  # 1. On remplace l'image Docker par l'exécuteur de Google Kaniko
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]

  # 2. PLUS BESOIN de la section "services" (on oublie dind et les problèmes de TLS)

  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

  before_script:
    # 3. On crée le fichier de configuration d'authentification pour le Registry GitLab
    # C'est l'équivalent strict du "docker login", mais au format JSON pour Kaniko
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

  script:
    # 4. Kaniko lit le Dockerfile, compile en user-space et push l'image finale tout seul
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_TAG}"
      --skip-tls-verify
      --cache=true
      --cache-repo="${CI_REGISTRY_IMAGE}/cache"
      --snapshot-mode=redo

  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev" 

deploy_to_server:
  stage: deploy
  image: alpine:3.24
  script:
    # 1. Installation du client SSH
    - apk add --no-cache openssh-client

    # 2. Configuration temporaire de la clé privée de production
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$PROD_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

    # 3. Préparation du terrain sur le serveur distant (via SSH direct)
    - ssh -i ~/.ssh/id_ed25519 root@$PROD_URL "mkdir -p /opt/tngpt"

    # 4. TRÈS IMPORTANT : On envoie le plan de prod (docker-compose.yml) sur le serveur
    # On utilise scp (Secure Copy) pour transférer le fichier local vers le VPS
    - scp -i ~/.ssh/id_ed25519 docker-compose.yml root@$PROD_URL:/opt/tngpt/docker-compose.yml

    # 5. Déclenchement du déploiement par Docker Compose sur le serveur distant
    - |
      ssh -i ~/.ssh/id_ed25519 root@$PROD_URL "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        export IMAGE_TAG=$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG &&
        cd /opt/tngpt &&
        docker compose pull &&
        docker compose up -d --remove-orphans &&
        docker image prune -f
      "
  environment:
    name: production
    url: $PROD_URL:8501
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev" 

pages:
  stage: deploy
  script:
    - uv sync
    - uv run python docs/gen_ref_pages.py
    - uv run zensical build --strict --clean
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev" 
