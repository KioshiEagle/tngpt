# =========================================================================
# 3. ÉTAPE DE FABRICATION DE L'IMAGE DOCKER
# =========================================================================
build_and_push_image:
  stage: docker_build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  only:
    - master

# =========================================================================
# 4. ÉTAPE DE DÉPLOIEMENT EN PRODUCTION (SSH sur o2switch)
# =========================================================================
deploy_to_server:
  stage: deploy_prod
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    
    # Commande distante pour mettre à jour le conteneur Docker sur ton serveur
    - |
      ssh -p 2244 veje9357@veje9357.odns.fr "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $CI_REGISTRY_IMAGE:master &&
        docker stop tngpt-container || true &&
        docker rm tngpt-container || true &&
        docker run -d --name tngpt-container -p 5000:5000 --env-file /home/veje9357/.env $CI_REGISTRY_IMAGE:master
      "
  environment:
    name: production
    url: https://tngpt.jeancharles-vente.fr
  only:
    - master