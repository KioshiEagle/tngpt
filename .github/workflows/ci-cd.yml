name: CI/CD

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kioshieagle/tngpt

jobs:
  # ---- check_code_quality stage ----
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.11.21-python3.13-trixie
    steps:
      - uses: actions/checkout@v7
      - run: uv lock --check
      - run: uvx ruff check . --statistics
      - run: uvx ruff format . --check
      - run: uv check
      # uv check est encore expérimental donc on garde uvx ty check pour l'instant
      - run: uvx ty check

  check_security:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.11.21-python3.13-trixie
    steps:
      - uses: actions/checkout@v7
      - run: uvx bandit -c pyproject.toml -r .
      - run: uv audit
      # uv audit est encore expérimental donc on garde pip-audit pour l'instant
      - run: uvx pip-audit

  # ---- test stage ----
  pytest:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.11.21-python3.13-trixie
    needs:
      - lint
      - check_security
    steps:
      - uses: actions/checkout@v7
      - run: uv sync
      - run: uv run pytest tests/

  # ---- build stage ----
  # Un push sur main publie l'image puis la release qui va avec. L'ordre compte :
  # l'image part la première, pour qu'aucune release ne puisse désigner une
  # image absente du registre.
  build_and_push_image:
    runs-on: ubuntu-latest
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    # Deux pushs rapprochés calculeraient le même numéro : on sérialise plutôt
    # que de laisser le second échouer sur un tag déjà pris.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique et tags complets : la version suivante se déduit du
          # dernier tag, invisible dans le clone superficiel par défaut.
          fetch-depth: 0

      # Les tags git font foi, pas pyproject.toml : eux seuls savent ce qui a
      # déjà été publié. Le motif minuscule ignore au passage les V1.0 et V2.0
      # historiques, qui n'ont pas de numéro de correctif.
      - name: Calculer la version suivante
        id: version
        run: |
          set -euo pipefail
          # Sans tube : `head` fermerait le tuyau et ferait tomber `git` sur
          # un SIGPIPE, que `pipefail` remonterait en échec de l'étape.
          tags=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)
          dernier=${tags%%$'\n'*}
          dernier=${dernier:-v0.0.0}
          IFS=. read -r majeur mineur correctif <<< "${dernier#v}"
          suivant="v${majeur}.${mineur}.$((correctif + 1))"
          echo "Dernier tag : ${dernier} → nouveau tag : ${suivant}"
          echo "version=${suivant}" >> "$GITHUB_OUTPUT"
          echo "serie=v${majeur}.${mineur}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.serie }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Poussé avec GITHUB_TOKEN, donc sans relancer ce workflow : GitHub
      # refuse d'enchaîner sur un évènement produit par son propre jeton.
      - name: Poser le tag git
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # `generate_release_notes` reconstruit le journal depuis la release
      # précédente ; le `body` fourni vient se placer avant.
      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="${{ steps.version.outputs.version }}" \
            -f name="${{ steps.version.outputs.version }}" \
            -F generate_release_notes=true \
            -f body="Image : \`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`"

  # ---- deploy stage ----
  pages_build:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.11.21-python3.13-trixie
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - run: uv sync
      - run: uv run python docs/gen_ref_pages.py
      - run: uv run zensical build --strict --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  pages_deploy:
    runs-on: ubuntu-latest
    needs: pages_build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
